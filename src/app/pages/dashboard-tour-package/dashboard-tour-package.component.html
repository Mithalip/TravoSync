<h2 class="text-center mb-4">Tour Package Details</h2>

<div class="table-responsive">
    <table class="table table-bordered table-hover text-center shadow-lg bg-white rounded">
        <thead class="table-dark">
            <tr>
                <th>Id</th>
                <th>Destination</th>
                <th>Package Name</th>
                <th>Price</th>
                <th>Duration</th>
                <th>Admin ID</th>
                <th>Image</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let package of tourPackageArray | paginate:{itemsPerPage:2, currentPage:p}">
                <td>{{package.id}}</td>
                <td>{{package.destination}}</td>
                <td>{{package.package_name}}</td>
                <td>{{package.price | currency:'USD'}}</td>
                <td>{{package.duration}}</td>
                <td>{{package.admin_id}}</td>
                <td>
                    <img [src]="package.image_url" alt="Tour Image" class="tour-img">
                </td>
                <td>
                    <button class="btn btn-danger btn-sm me-2" (click)="deleteTourPackage(package.id)">
                        <i class="bi bi-trash3"></i> Delete
                    </button>
                    <button class="btn btn-primary btn-sm" (click)="updateTourPackage(package.id)">
                        <i class="bi bi-pencil-square"></i> Edit
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<div class="pagination-container">
    <pagination-controls (pageChange)="p=$event"></pagination-controls>
</div>
